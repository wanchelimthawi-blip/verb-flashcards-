<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b55"><title>Verb Flashcards | ครูผู้ช่วย</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans Thai',sans-serif;color:#172a4c;background:#f1f5ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 0%,#dbeafe,transparent 45%),#f1f5ff}.wrap{max-width:760px;margin:auto;padding:24px 16px 40px}header{text-align:center}h1{font-size:clamp(25px,5vw,38px);margin:8px 0}p{color:#5c6c87}.pill{display:inline-block;border-radius:100px;background:#dce8ff;color:#1c4a99;padding:7px 14px;font-weight:700;font-size:13px}.toolbar,.actions,.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}button{border:0;border-radius:14px;padding:12px 17px;background:#fff;color:#1a396f;font:inherit;font-weight:700;box-shadow:0 2px 9px #10254b13;cursor:pointer;min-height:45px}button.primary{background:#214fbb;color:white}button:focus-visible{outline:3px solid #ffb23d}button.active{background:#dce8ff}button:disabled{opacity:.45;cursor:not-allowed}.progress{height:9px;border-radius:20px;background:#d8e1f1;overflow:hidden;margin:16px 0}.progress>div{height:100%;background:#4d7ee6;transition:width .2s}.counter{text-align:center;color:#5c6c87;font-weight:700}.card{display:block;position:relative;width:100%;min-height:330px;border:0;background:none;box-shadow:none;padding:0;perspective:1000px;cursor:pointer}.inner{position:relative;width:100%;min-height:330px;transition:transform .55s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:28px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;box-shadow:0 15px 40px #17315e1d;background:linear-gradient(135deg,#244caa,#122d69);color:white}.back{transform:rotateY(180deg);background:#fff;color:#182d58}.word{font-size:clamp(45px,10vw,76px);font-weight:850;letter-spacing:-2px}.sub{font-size:19px;margin:12px 0}.hint{font-size:14px;opacity:.78;margin-top:24px}.back .word{font-size:clamp(32px,7vw,52px)}.mea </style></head><body><main class="wrap"><header><span class="pill">เตรียมสอบครูผู้ช่วย • ภาค ก.</span><h1>📚 Verb Flashcards</h1><p>ท่องจำกริยา 3 ช่อง 60 คำ • คำอ่าน • คำแปล</p></header><div class="toolbar"><button id="flashMode" class="active">🃏 แฟลชการ์ด</button><button id="quizMode">✍️ ทดสอบ</button><button id="shuffle">🔀 สุ่มคำ</button></div><div id="flashView"><div class="counter" id="counter"></div><div class="progress"><div id="bar"></div></div><button class="card" id="card" aria-label="แตะเพื่อพลิกการ์ด"><div class="inner"><div class="face"><div class="pill" style="background:#ffffff25;color:white">กริยาช่องที่ 1</div><div class="word" id="frontWord"></div><div class="sub" id="frontSound"></div><div class="hint">👆 แตะเพื่อดูช่องที่ 2, 3 และคำแปล</div></div><div class="face back"><div class="pill">เฉลยกริยา 3 ช่อง</div><div class="word" id="backWord"></div><div class="detail" id="backSounds"></div><div class="meaning" id="meaning"></div><div class="hint">👆 แตะเพื่อพลิกกลับ</div></div></div></button><div class="nav"><button id="prev">← ก่อนหน้า</button><button id="speak">🔊 ฟังเสียง</button><button id="next" class="primary">ถัดไป →</button></div><div class="actions"><button id="review">🔁 ยังจำไม่ได้</button><button id="known">✓ จำได้แล้ว</button></div><section class="section"><h2>ความคืบหน้าการท่องจำ</h2><div class="stats"><div><strong id="knownCount">0</strong><small>จำได้แล้ว</small></div><div><strong id="reviewCount">0</strong><small>ทบทวนอีก</small></div><div><strong id="remainCount">8</strong><small>ยังไม่ได้ประเมิน</small></div></div><div class="grid" id="grid" style="margin-top:15px"></div><div class="actions"><button id="reset">ล้างความคืบหน้า</button></div></section></div><div id="quizView" class="hidden"><section class="section"><div class="counter" id="quizCounter"></div><div class="progress"><div id="quizBar"></div></div><div class="quizq" id="quizQuestion"></div><p style="text-align:center">เลือกกริยาช่องที่ 2 และ 3 ที่ถูกต้อง</p><div class="options" id="options"></div><p class="feedback" id="feedback" aria-live="polite"></p><div class="nav"><button class="primary" id="quizNext" disabled>ข้อถัดไป →</button></div></section></div><p class="foot">ใช้งานบน iPad และมือถือได้ • บันทึกความคืบหน้าในเบราว์เซอร์ของอุปกรณ์</p></main><script>
const words=[{"v1":"go","v2":"went","v3":"gone","p1":"โก","p2":"เวนท์","p3":"กอน","th":"ไป"},{"v1":"come","v2":"came","v3":"come","p1":"คัม","p2":"เคม","p3":"คัม","th":"มา"},{"v1":"eat","v2":"ate","v3":"eaten","p1":"อีท","p2":"เอท","p3":"อีทเทิน","th":"กิน"},{"v1":"drink","v2":"drank","v3":"drunk","p1":"ดริงค์","p2":"แดรงค์","p3":"ดรังค์","th":"ดื่ม"},{"v1":"see","v2":"saw","v3":"seen","p1":"ซี","p2":"ซอ","p3":"ซีน","th":"เห็น"},{"v1":"do","v2":"did","v3":"done","p1":"ดู","p2":"ดิด","p3":"ดัน","th":"ทำ"},{"v1":"make","v2":"made","v3":"made","p1":"เมค","p2":"เมด","p3":"เมด","th":"ทำ / สร้าง"},{"v1":"take","v2":"took","v3":"taken","p1":"เทค","p2":"ทุค","p3":"เทเคิน","th":"เอา / พาไป"},{"v1":"give","v2":"gave","v3":"given","p1":"กิฟ","p2":"เกฟ","p3":"กิฟเวิน","th":"ให้"},{"v1":"get","v2":"got","v3":"got/gotten","p1":"เก็ท","p2":"กอท","p3":"กอท/กอทเทิน","th":"ได้รับ"},{"v1":"write","v2":"wrote","v3":"written","p1":"ไรท์","p2":"โรท","p3":"ริทเทิน","th":"เขียน"},{"v1":"read","v2":"read","v3":"read","p1":"รีด","p2":"เรด","p3":"เรด","th":"อ่าน"},{"v1":"speak","v2":"spoke","v3":"spoken","p1":"สปีค","p2":"สโพค","p3":"สโพเคิน","th":"พูด"},{"v1":"break","v2":"broke","v3":"broken","p1":"เบรค","p2":"โบรค","p3":"โบรเคิน","th":"แตก"},{"v1":"choose","v2":"chose","v3":"chosen","p1":"ชูซ","p2":"โชซ","p3":"โชเซิน","th":"เลือก"},{"v1":"know","v2":"knew","v3":"known","p1":"โน","p2":"นิว","p3":"โนน","th":"รู้"},{"v1":"begin","v2":"began","v3":"begun","p1":"บิกิน","p2":"บิแกน","p3":"บิกัน","th":"เริ่ม"},{"v1":"sing","v2":"sang","v3":"sung","p1":"ซิง","p2":"แซง","p3":"ซัง","th":"ร้องเพลง"},{"v1":"swim","v2":"swam","v3":"swum","p1":"สวิม","p2":"สแวม","p3":"สวัม","th":"ว่ายน้ำ"},{"v1":"run","v2":"ran","v3":"run","p1":"รัน","p2":"แรน","p3":"รัน","th":"วิ่ง"},{"v1":"buy","v2":"bought","v3":"bought","p1":"บาย","p2":"บอท","p3":"บอท","th":"ซื้อ"},{"v1":"bring","v2":"brought","v3":"brought","p1":"บริง","p2":"บรอท","p3":"บรอท","th":"นำมา"},{"v1":"think","v2":"thought","v3":"thought","p1":"ธิงค์","p2":"ธอท","p3":"ธอท","th":"คิด"},{"v1":"teach","v2":"taught","v3":"taught","p1":"ทีช","p2":"ทอท","p3":"ทอท","th":"สอน"},{"v1":"catch","v2":"caught","v3":"caught","p1":"แคทช์","p2":"คอท","p3":"คอท","th":"จับ"},{"v1":"find","v2":"found","v3":"found","p1":"ไฟนด์","p2":"ฟาวนด์","p3":"ฟาวนด์","th":"พบ"},{"v1":"lose","v2":"lost","v3":"lost","p1":"ลูซ","p2":"ลอสท์","p3":"ลอสท์","th":"ทำหาย"},{"v1":"leave","v2":"left","v3":"left","p1":"ลีฟ","p2":"เลฟท์","p3":"เลฟท์","th":"ออกจาก"},{"v1":"feel","v2":"felt","v3":"felt","p1":"ฟีล","p2":"เฟลท์","p3":"เฟลท์","th":"รู้สึก"},{"v1":"keep","v2":"kept","v3":"kept","p1":"คีพ","p2":"เคพท์","p3":"เคพท์","th":"เก็บ / รักษา"},{"v1":"sleep","v2":"slept","v3":"slept","p1":"สลีพ","p2":"สเลพท์","p3":"สเลพท์","th":"นอนหลับ"},{"v1":"meet","v2":"met","v3":"met","p1":"มีท","p2":"เมท","p3":"เมท","th":"พบ"},{"v1":"send","v2":"sent","v3":"sent","p1":"เซนด์","p2":"เซนท์","p3":"เซนท์","th":"ส่ง"},{"v1":"build","v2":"built","v3":"built","p1":"บิลด์","p2":"บิลท์","p3":"บิลท์","th":"สร้าง"},{"v1":"tell","v2":"told","v3":"told","p1":"เทล","p2":"โทลด์","p3":"โทลด์","th":"บอก"},{"v1":"say","v2":"said","v3":"said","p1":"เซ","p2":"เซด","p3":"เซด","th":"กล่าว"},{"v1":"have","v2":"had","v3":"had","p1":"แฮฟ","p2":"แฮด","p3":"แฮด","th":"มี"},{"v1":"be","v2":"was/were","v3":"been","p1":"บี","p2":"วอซ/เวอร์","p3":"บิน","th":"เป็น / อยู่ / คือ"},{"v1":"become","v2":"became","v3":"become","p1":"บิคัม","p2":"บิเคม","p3":"บิคัม","th":"กลายเป็น"},{"v1":"forget","v2":"forgot","v3":"forgotten","p1":"เฟอร์เก็ท","p2":"เฟอร์กอท","p3":"เฟอร์กอทเทิน","th":"ลืม"},{"v1":"work","v2":"worked","v3":"worked","p1":"เวิร์ค","p2":"เวิร์คท์","p3":"เวิร์คท์","th":"ทำงาน"},{"v1":"play","v2":"played","v3":"played","p1":"เพลย์","p2":"เพลย์ด","p3":"เพลย์ด","th":"เล่น"},{"v1":"study","v2":"studied","v3":"studied","p1":"สตัดดี","p2":"สตัดดีด","p3":"สตัดดีด","th":"เรียน"},{"v1":"live","v2":"lived","v3":"lived","p1":"ลิฟ","p2":"ลิฟด์","p3":"ลิฟด์","th":"อาศัยอยู่"},{"v1":"visit","v2":"visited","v3":"visited","p1":"วิซิท","p2":"วิซิททิด","p3":"วิซิททิด","th":"เยี่ยมชม"},{"v1":"watch","v2":"watched","v3":"watched","p1":"วอทช์","p2":"วอทช์ท","p3":"วอทช์ท","th":"ดู"},{"v1":"walk","v2":"walked","v3":"walked","p1":"วอค","p2":"วอคท์","p3":"วอคท์","th":"เดิน"},{"v1":"talk","v2":"talked","v3":"talked","p1":"ทอค","p2":"ทอคท์","p3":"ทอคท์","th":"พูดคุย"},{"v1":"open","v2":"opened","v3":"opened","p1":"โอเพิน","p2":"โอเพินด์","p3":"โอเพินด์","th":"เปิด"},{"v1":"close","v2":"closed","v3":"closed","p1":"โคลซ","p2":"โคลซด์","p3":"โคลซด์","th":"ปิด"},{"v1":"help","v2":"helped","v3":"helped","p1":"เฮลพ์","p2":"เฮลพ์ท","p3":"เฮลพ์ท","th":"ช่วยเหลือ"},{"v1":"clean","v2":"cleaned","v3":"cleaned","p1":"คลีน","p2":"คลีนด์","p3":"คลีนด์","th":"ทำความสะอาด"},{"v1":"finish","v2":"finished","v3":"finished","p1":"ฟินิช","p2":"ฟินิชท์","p3":"ฟินิชท์","th":"ทำเสร็จ"},{"v1":"start","v2":"started","v3":"started","p1":"สตาร์ท","p2":"สตาร์ททิด","p3":"สตาร์ททิด","th":"เริ่มต้น"},{"v1":"want","v2":"wanted","v3":"wanted","p1":"วอนท์","p2":"วอนทิด","p3":"วอนทิด","th":"ต้องการ"},{"v1":"need","v2":"needed","v3":"needed","p1":"นีด","p2":"นีดิด","p3":"นีดิด","th":"จำเป็นต้อง"},{"v1":"use","v2":"used","v3":"used","p1":"ยูซ","p2":"ยูซด์","p3":"ยูซด์","th":"ใช้"},{"v1":"call","v2":"called","v3":"called","p1":"คอล","p2":"คอลด์","p3":"คอลด์","th":"โทร / เรียก"},{"v1":"answer","v2":"answered","v3":"answered","p1":"แอนเซอร์","p2":"แอนเซอร์ด","p3":"แอนเซอร์ด","th":"ตอบ"},{"v1":"arrive","v2":"arrived","v3":"arrived","p1":"อะไรฟ์","p2":"อะไรฟ์ด","p3":"อะไรฟ์ด","th":"มาถึง"}];
const $=id=>document.getElementById(id);let order=words.map((_,i)=>i),pos=0,flipped=false,status={};try{status=JSON.parse(localStorage.getItem('verb60status')||'{}')}catch{};function save(){try{localStorage.setItem('verb60status',JSON.stringify(status))}catch{}}function render(){const w=words[order[pos]];flipped=false;$('card').classList.remove('flipped');$('frontWord').textContent=w.v1;$('frontSound').textContent='('+w.p1+')';$('backWord').textContent=w.v1+' → '+w.v2;$('backSounds').textContent='V.1 '+w.p1+' | V.2 '+w.p2+'\nV.3 '+w.v3+' ('+w.p3+')';$('meaning').textContent=w.th;$('counter').textContent='การ์ด '+(pos+1)+' / '+words.length;$('bar').style.width=((pos+1)/words.length*100)+'%';$('knownCount').textContent=Object.values(status).filter(x=>x==='known').length;$('reviewCount').textContent=Object.values(status).filter(x=>x==='review').length;$('remainCount').textContent=words.length-Object.keys(status).length;$('grid').innerHTML='';order.forEach((idx,i)=>{let b=document.createElement('button');b.textContent=words[idx].v1;b.className=(i===pos?'current ':'')+(status[idx]||'');b.onclick=()=>{pos=i;render()};$('grid').append(b)})}function move(n){pos=(pos+n+order.length)%order.length;render()}$('card').onclick=()=>{$('card').classList.toggle('flipped');flipped=!flipped};$('next').onclick=()=>move(1);$('prev').onclick=()=>move(-1);function mark(s){status[order[pos]]=s;save();move(1)}$('known').onclick=()=>mark('known');$('review').onclick=()=>mark('review');$('reset').onclick=()=>{if(confirm('ล้างความคืบหน้าทั้งหมด?')){status={};save();render()}};function shuffle(a){return [...a].sort(()=>Math.random()-.5)}$('shuffle').onclick=()=>{order=shuffle(order);pos=0;render();if(!$('quizView').classList.contains('hidden'))startQuiz()};$('speak').onclick=()=>{if(!('speechSynthesis'in window)){alert('เบราว์เซอร์นี้ไม่รองรับเสียงพูด');return}speechSynthesis.cancel();let w=words[order[pos]],u=new SpeechSynthesisUtterance(w.v1+', '+w.v2+', '+w.v3);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)};let quizOrder=[],qi=0,score=0,answered=false;function startQuiz(){quizOrder=shuffle(words.map((_,i)=>i));qi=0;score=0;quizRender()}function quizRender(){if(qi>=words.length){$('quizCounter').textContent='จบแบบทดสอบ';$('quizQuestion').textContent='🎉 ได้ '+score+' / '+words.length+' คะแนน';$('options').innerHTML='';$('feedback').textContent=score===words.length?'ยอดเยี่ยม! จำได้ครบทุกคำ':'กลับไปทบทวนแล้วลองใหม่อีกครั้ง';$('quizNext').textContent='ทำแบบทดสอบอีกครั้ง';$('quizNext').disabled=false;$('quizNext').onclick=startQuiz;return}answered=false;const w=words[quizOrder[qi]];$('quizCounter').textContent='ข้อ '+(qi+1)+' / '+words.length+' • คะแนน '+score;$('quizBar').style.width=(qi/words.length*100)+'%';$('quizQuestion').textContent=w.v1+' ('+w.p1+')';$('feedback').textContent='';$('quizNext').disabled=true;$('quizNext').textContent='ข้อถัดไป →';$('quizNext').onclick=()=>{qi++;quizRender()};const wrong=shuffle(words.filter(x=>x!==w)).slice(0,3);const opts=shuffle([w,...wrong]);$('options').innerHTML='';opts.forEach(x=>{let b=document.createElement('button');b.textContent=x.v2+' / '+x.v3;b.onclick=()=>{if(answered)return;answered=true;const correct=x===w;if(correct)score++;$('feedback').textContent=correct?'✓ ถูกต้อง! '+w.th:'✗ คำตอบคือ '+w.v2+' / '+w.v3+' — '+w.th;[...$('options').children].forEach(el=>{el.disabled=true;if(el.textContent===w.v2+' / '+w.v3)el.classList.add('correct');else if(el===b)el.classList.add('wrong')});$('quizNext').disabled=false};$('options').append(b)})}function mode(quiz){$('flashView').classList.toggle('hidden',quiz);$('quizView').classList.toggle('hidden',!quiz);$('flashMode').classList.toggle('active',!quiz);$('quizMode').classList.toggle('active',quiz);if(quiz)startQuiz()}$('flashMode').onclick=()=>mode(false);$('quizMode').onclick=()=>mode(true);document.addEventListener('keydown',e=>{if(!$('quizView').classList.contains('hidden'))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.key===' '){e.preventDefault();$('card').click()}});render();
</script></body></html>
