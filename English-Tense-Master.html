if(page==='words'){let w=W[wi];h=`<div class="card"><h2>แฟลชการ์ด</h2><small>${wi+1}/${W.length} · จำได้ ${d.known.length} คำ</small>${bar(d.known.length,W.length)}<div class="flash" onclick="act('flip')"><div class="big">${flip?w[2]:w[0]}</div><p>${flip?w[0]:w[1]}</p>${flip&&w[3]?w[0]+' · '+w[3]+' · '+w[4]:''}<small>แตะเพื่อพลิก ${d.known.includes(wi)?'✓ จำได้แล้ว':''}</small></div><div class="actions">${B('🔊 ฟังเสียง','sound:'+wi)}${B('พลิกการ์ด','flip')}</div><div class="actions">${B('ยังจำไม่ได้','unknown')}${B('✓ จำได้แล้ว','known','primary')}</div><div class="actions">${B('‹ ก่อนหน้า','prevword')}${B('สุ่ม','random')}${B('ถัดไป ›','nextword')}</div></div><div class="card"><h3>คลังคำศัพท์</h3><input id="search" placeholder="ค้นหาคำศัพท์" oninput="list()"><select id="filter" onchange="list()"><option value="all">ทั้งหมด</option><option value="known">จำได้แล้ว</option><option value="new">ยังจำไม่ได้</option><option value="verb">คำกริยา</option></select><div id="list"></div></div>`}
if(page==='stats')h=`<div class="card"><h2>ความก้าวหน้า</h2><div class="grid">${[[d.done.length+'/12','บทเรียน'],[d.known.length,'คำศัพท์'],[d.best+'%','คะแนนสูงสุด'],[d.attempts,'ครั้งที่สอบจบ']].map(([v,s])=>`<div class="formula"><div class="big">${v}</div>${s}</div>`).join('')}</div><h3>Level ${1+Math.floor(d.xp/100)}</h3>${bar(d.xp%100,100)}<p>${d.xp} XP</p></div><div class="card"><h3>เหรียญความสำเร็จ</h3><p>${d.done.length?'🏅':'🔒'} บทเรียนแรก</p><p>${d.done.length===12?'🏅':'🔒'} ครบ 12 Tenses</p><p>${d.known.length>=20?'🏅':'🔒'} จำศัพท์ 20 คำ</p><p>${d.best===100?'🏅':'🔒'} คะแนนเต็ม</p></div>`;m.innerHTML=h;if(page==='words')list()}
function list(){let s=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value;document.getElementById('list').innerHTML=W.map((w,i)=>({w,i})).filter(({w,i})=>w.slice(0,3).join(' ').toLowerCase().includes(s)&&(f==='all'||f==='known'&&d.known.includes(i)||f==='new'&&!d.known.includes(i)||f==='verb'&&w.length>3)).map(({w,i})=>`<div class="word ${d.known.includes(i)?'good':''}"><div><b>${w[0]}</b> · ${w[2]}<br><small>${w[1]} ${w[3]?' · '+w[3]+' · '+w[4]:''}</small></div>${B('🔊','sound:'+i)}${B(d.known.includes(i)?'✓':'+','toggle:'+i)}</div>`).join('')||'ไม่พบคำศัพท์'}
function act(k){let [a,v]=k.split(':'),n=Number(v);if(a==='page'){page=v;if(v==='learn')li=-1}else if(a==='dark')d.dark=!d.dark;else if(a==='continue'){page='learn';li=T.findIndex((_,i)=>!d.done.includes(i));if(li<0)li=0}else if(a==='lesson')li=n;else if(a==='back')li=-1;else if(a==='prevlesson')li=Math.max(0,li-1);else if(a==='nextlesson')li=Math.min(11,li+1);else if(a==='done'){if(!d.done.includes(li)){d.done.push(li);d.xp+=20}}else if(a==='speaklesson'){say(T[li][6]);return}else if(a==='sound'){say(W[n][0]);return}else if(a==='start'){start(v);return}else if(a==='selectquiz'){start(document.getElementById('mode').value);return}else if(a==='retry'){start(mode);return}else if(a==='clear'){Q=[];end=false}else if(a==='answer'){if(A[qi]===undefined)A[qi]=Q[qi].o[n]}else if(a==='nextq'){if(A[qi]===undefined)return;if(qi===Q.length-1){end=true;let score=A.filter((x,i)=>x===Q[i].a).length;d.xp+=score*5;d.best=Math.max(d.best,Math.round(score/Q.length*100));d.attempts++}else qi++}else if(a==='flip')flip=!flip;else if(a==='known'||a==='unknown'||a==='toggle'){let i=a==='toggle'?n:wi;if(a==='unknown'||a==='toggle'&&d.known.includes(i))d.known=d.known.filter(x=>x!==i);else if(!d.known.includes(i)){d.known.push(i);d.xp+=5}if(a!=='toggle'){wi=(wi+1)%W.length;flip=false}else{save();list();document.getElementById('xp').textContent=`⚡ ${d.xp} XP · 🏆 Level ${1+Math.floor(d.xp/100)}`;return}}else if(a==='prevword'){wi=(wi+W.length-1)%W.length;flip=false}else if(a==='nextword'){wi=(wi+1)%W.length;flip=false}else if(a==='random'){wi=Math.floor(Math.random()*W.length);flip=false}save();render();if(['page','lesson','continue','back','nextlesson','prevlesson'].includes(a))window.scrollTo(0,0)}render();
</script></body></html>
